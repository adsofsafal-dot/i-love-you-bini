<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Surprise 💧</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #dff7ff, #f8fdff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #102333;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 30px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 80, 120, 0.15);
    }

    .drop {
      font-size: 75px;
      margin-bottom: 18px;
      animation: float 2s ease-in-out infinite;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .description {
      font-size: 17px;
      line-height: 1.6;
      color: #667781;
      margin-bottom: 28px;
    }

    .continue-btn {
      border: none;
      background: #1296dc;
      color: white;
      padding: 16px 30px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(18, 150, 220, 0.25);
      transition: 0.25s;
    }

    .continue-btn:hover {
      background: #087fc0;
      transform: translateY(-2px);
    }

    .continue-btn:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 22px;
      font-size: 15px;
      line-height: 1.6;
    }

    .error {
      color: #d62828;
    }

    .success {
      color: #16803c;
    }

    .retry-btn {
      margin-top: 12px;
      border: none;
      padding: 11px 20px
    }
