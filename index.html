<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  }
  .card {
    width: min(90%, 430px);
    padding: 45px 25px;
    text-align: center;
    background: rgba(255,255,255,.9);
    border-radius: 28px;
    box-shadow: 0 15px 50px rgba(0,0,0,.18);
    position: relative;
    z-index: 2;
  }
  h1 { color: #e63967; margin-bottom: 12px; }
  p { color: #555; font-size: 18px; }
  button {
    border: 0;
    border-radius: 999px;
    padding: 15px 32px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #e63967;
    color: white;
    box-shadow: 0 8px 20px rgba(230,57,103,.35);
    transition: transform .2s;
  }
  button:hover { transform: scale(1.06); }
  #love { display: none; }
  #love h2 {
    font-size: clamp(38px, 11vw, 65px);
    color: #e63967;
    margin: 10px 0;
    animation: pop .7s ease;
  }
  .heart {
    position: fixed;
    bottom: -30px;
    font-size: 24px;
    animation: float 4s linear forwards;
    pointer-events: none;
  }
  @keyframes pop {
    0% { transform: scale(.2); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes float {
    from { transform: translateY(0) rotate(0deg); opacity: 1; }
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div id="intro">
      <div style="font-size:55px;">💌</div>
      <h1>A Little Surprise...</h1>
      <p>There is something I really want to tell you.</p>
      <button onclick="openLove()">Press Open ❤️</button>
    </div>

    <div id="love">
      <div style="font-size:65px;">🥹❤️</div>
      <h2>I LOVE YOU, BINI</h2>
      <p>More than words can explain. ❤️</p>
    </div>
  </div>

<script>
function openLove() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("love").style.display = "block";

  for (let i = 0; i < 35; i++) {
    setTimeout(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random()*3) + "s";
      heart.style.fontSize = (18 + Math.random()*25) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6500);
    }, i * 80);
  }
}
</script>
</body>
</html>
