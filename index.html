<!-- =========================================================
     GALLERY — REALISTIC CLIPPED PHOTOGRAPHS
========================================================= -->

<style>

/* =========================================================
   GALLERY CONTAINER
========================================================= */

.gallery-track{
  align-items:start !important;
}


/* =========================================================
   EACH PHOTO = PHYSICAL PRINT
========================================================= */

.gallery-card{

  position:relative !important;

  overflow:visible !important;

  background:#f3efe4 !important;

  padding:12px 12px 42px 12px !important;

  border:0 !important;

  border-radius:2px !important;

  transform:
    rotate(-2deg);

  transform-origin:
    50% -10px;

  box-shadow:

    0 3px 5px rgba(0,0,0,.12),

    0 12px 20px rgba(0,0,0,.16),

    0 25px 40px rgba(0,0,0,.12);

  transition:

    transform .65s
    cubic-bezier(.16,1,.3,1),

    box-shadow .5s ease;

  will-change:transform;

  z-index:2 !important;
}


/* =========================================================
   DIFFERENT NATURAL ROTATIONS
========================================================= */

.gallery-card:nth-child(1){

  transform:
    rotate(-3deg);

}

.gallery-card:nth-child(2){

  transform:
    rotate(2.5deg);

}

.gallery-card:nth-child(3){

  transform:
    rotate(-1.5deg);

}

.gallery-card:nth-child(4){

  transform:
    rotate(3deg);

}


/* =========================================================
   IMAGE
========================================================= */

.gallery-card img{

  display:block !important;

  width:100% !important;

  height:100% !important;

  object-fit:cover !important;

  border:1px solid rgba(0,0,0,.12);

  transform:
    translateZ(8px);

  filter:
    contrast(1.03)
    saturate(.95);

  transition:

    transform .6s
    cubic-bezier(.16,1,.3,1),

    filter .5s ease;

}


/* =========================================================
   METAL CLIP
========================================================= */

.gallery-card::before{

  content:"";

  position:absolute;

  top:-23px;

  left:50%;

  width:48px;

  height:36px;

  transform:
    translateX(-50%)
    rotate(1deg);

  z-index:20;

  background:

    linear-gradient(
      90deg,

      #555 0%,

      #aaa 15%,

      #f1f1f1 30%,

      #777 47%,

      #eee 62%,

      #666 82%,

      #444 100%
    );

  border-radius:
    5px
    5px
    10px
    10px;

  box-shadow:

    0 3px 5px rgba(0,0,0,.3),

    inset 0 2px 2px
      rgba(255,255,255,.8),

    inset 0 -2px 3px
      rgba(0,0,0,.25);

}


/* =========================================================
   CLIP HOLE
========================================================= */

.gallery-card::after{

  content:"";

  position:absolute;

  top:-14px;

  left:50%;

  width:11px;

  height:11px;

  transform:
    translateX(-50%);

  z-index:30;

  border-radius:50%;

  background:#222;

  box-shadow:

    inset 0 2px 3px
      rgba(0,0,0,.8);

}


/* =========================================================
   SMALL HANGING STRING
========================================================= */

.gallery-card .clip-string{

  position:absolute;

  top:-55px;

  left:50%;

  width:2px;

  height:35px;

  transform:
    translateX(-50%);

  background:

    linear-gradient(
      90deg,
      #555,
      #ddd,
      #555
    );

  z-index:10;

}


/* =========================================================
   ADD STRING AUTOMATICALLY
========================================================= */

.gallery-card > img{

  position:relative;

}


/* =========================================================
   HOVER
========================================================= */

.gallery-card:hover{

  z-index:50 !important;

  transform:
    translateY(-12px)
    rotate(0deg)
    scale(1.035) !important;

  box-shadow:

    0 8px 12px rgba(0,0,0,.12),

    0 22px 40px rgba(0,0,0,.25),

    0 45px 70px rgba(0,0,0,.18);

}


.gallery-card:hover img{

  transform:
    scale(1.025);

  filter:

    contrast(1.07)
    saturate(1.03);

}


/* =========================================================
   IDLE SWING
========================================================= */

@keyframes galleryHang1{

  0%,100%{
    transform:rotate(-3deg);
  }

  50%{
    transform:rotate(-1deg);
  }

}

@keyframes galleryHang2{

  0%,100%{
    transform:rotate(2.5deg);
  }

  50%{
    transform:rotate(1deg);
  }

}

@keyframes galleryHang3{

  0%,100%{
    transform:rotate(-1.5deg);
  }

  50%{
    transform:rotate(1deg);
  }

}

@keyframes galleryHang4{

  0%,100%{
    transform:rotate(3deg);
  }

  50%{
    transform:rotate(1deg);
  }

}


/* Apply gentle movement */

.gallery-card:nth-child(1){
  animation:
    galleryHang1
    7s
    ease-in-out
    infinite;
}

.gallery-card:nth-child(2){
  animation:
    galleryHang2
    8s
    ease-in-out
    infinite;
}

.gallery-card:nth-child(3){
  animation:
    galleryHang3
    6.5s
    ease-in-out
    infinite;
}

.gallery-card:nth-child(4){
  animation:
    galleryHang4
    7.5s
    ease-in-out
    infinite;
}


/* Stop swinging when hovered */

.gallery-card:hover{

  animation-play-state:
    paused;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .gallery-card{

    padding:
      9px
      9px
      32px
      9px !important;

  }

  .gallery-card::before{

    width:42px;

    height:32px;

    top:-20px;

  }

}

@media(max-width:560px){

  .gallery-card{

    width:90% !important;

    margin:
      30px auto !important;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  .gallery-card{

    animation:none !important;

    transition:none !important;

  }

}

</style>


<script>

/* =========================================================
   GALLERY — MOUSE PHYSICS
========================================================= */

document.querySelectorAll(
  ".gallery-card"
).forEach((card) => {

  card.addEventListener(
    "mousemove",
    (event) => {

      const rect =
        card.getBoundingClientRect();

      const x =
        (
          event.clientX -
          rect.left
        )
        /
        rect.width
        -
        .5;

      const y =
        (
          event.clientY -
          rect.top
        )
        /
        rect.height
        -
        .5;


      const moveX =
        x * 10;

      const moveY =
        y * 7;

      const rotate =
        x * 5;


      card.style.transform = `
        translate(
          ${moveX}px,
          ${moveY - 8}px
        )
        rotate(
          ${rotate}deg
        )
        scale(1.035)
      `;


      /* subtle 3D image movement */

      const image =
        card.querySelector("img");

      if(image){

        image.style.transform = `
          translate(
            ${x * 4}px,
            ${y * 4}px
          )
          scale(1.025)
        `;

      }

    }
  );


  card.addEventListener(
    "mouseleave",
    () => {

      card.style.transform = "";

      const image =
        card.querySelector("img");

      if(image){

        image.style.transform = "";

      }

    }
  );

});


</script>
